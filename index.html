<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#051D2E" />
    <meta name="color-scheme" content="dark" />
    <title>Tread</title>
  </head>
  <body>
    <div id="game-root"></div>

    <div id="rotate-overlay" hidden>
      <div class="rotate-card">
        <div class="phone-icon" aria-hidden="true"></div>
        <p>Gira el teléfono</p>
        <span>Tread se juega en horizontal</span>
      </div>
    </div>

    <div id="touch-ui" aria-hidden="true">
      <div class="cluster">
        <button type="button" id="btn-left" data-dir="left" aria-label="Izquierda">◀</button>
        <button type="button" id="btn-right" data-dir="right" aria-label="Derecha">▶</button>
      </div>
      <button type="button" id="btn-jump" aria-label="Saltar">SALTAR</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
